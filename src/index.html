<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quadro — leitor de HQ</title>
<meta name="theme-color" content="#111014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#111014; --bg2:#1a181f; --card:#211f27; --line:#2e2b36;
    --tx:#f2eee6; --tx2:#a49fae; --acc:#ffcc33; --acc2:#ff5a3c;
    --r:14px;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;overflow:clip;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- Biblioteca ---------- */
  #library{position:absolute;inset:0;overflow-y:auto;padding:max(28px,env(safe-area-inset-top)) clamp(18px,4vw,56px) 80px}
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .brand .logo{width:44px;height:44px;border-radius:12px;background:var(--acc);display:grid;place-items:center;transform:rotate(-4deg);box-shadow:4px 4px 0 var(--acc2)}
  .brand .logo svg{width:28px;height:28px}
  .brand h1{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
  .brand small{display:block;color:var(--tx2);font-size:13px;font-weight:500;letter-spacing:0}
  .btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;transition:transform .12s,background .2s}
  .btn:active{transform:scale(.96)}
  .btn.pri{background:var(--acc);color:#1a1300;border-color:transparent}
  .btn svg{width:20px;height:20px}
  .banner{display:flex;align-items:center;gap:14px;background:#2a2410;border:1px solid #5a4a12;color:#ffe08a;border-radius:var(--r);padding:12px 16px;margin-bottom:22px}
  .banner .btn{height:38px;margin-left:auto}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--tx2);font-weight:700;margin:6px 0 16px}
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px;margin-bottom:38px}
  .shelf.row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(150px,170px);overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
  .comic{position:relative;text-align:left;scroll-snap-align:start}
  .comic .cv{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2a2731,#1c1a21);box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .18s}
  .comic:active .cv{transform:scale(.96)}
  .comic img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
  .comic img.on{opacity:1}
  .comic .ph{position:absolute;inset:0;display:grid;place-items:center;color:#4a4652;font-size:42px;font-weight:900}
  .comic .bar{z-index:2;position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.55)}
  .comic .bar i{display:block;height:100%;background:var(--acc)}
  .comic .t{margin-top:10px;font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .comic .s{font-size:12px;color:var(--tx2);margin-top:3px}
  .comic .x{z-index:3;position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;opacity:0;transition:opacity .2s}
  .comic:hover .x{opacity:1}
  .empty{border:2px dashed var(--line);border-radius:20px;padding:56px 24px;text-align:center;color:var(--tx2);max-width:640px;margin:40px auto}
  .empty b{display:block;color:var(--tx);font-size:22px;margin-bottom:8px}
  body.drag #library{outline:3px dashed var(--acc);outline-offset:-12px}

  /* ---------- Leitor ---------- */
  #reader{position:absolute;inset:0;overflow:hidden;overflow:clip;background:radial-gradient(ellipse at center,#1d1b22 0%,#0b0a0d 75%)}
  #stage{position:absolute;inset:0;overflow:hidden;overflow:clip;touch-action:none;display:flex;align-items:center;justify-content:center;padding:10px}
  #book{width:100%;height:100%}
  .page{background:#18161c;overflow:hidden}
  .page img{width:100%;height:100%;object-fit:fill;display:block;opacity:0;transition:opacity .25s;pointer-events:none;-webkit-user-drag:none}
  .page img.on{opacity:1}
  .page.blank{background:#f4f1ea}
  .page .spin{position:absolute;inset:0;display:grid;place-items:center}
  .page .spin::after{content:"";width:34px;height:34px;border-radius:50%;border:3px solid #35313c;border-top-color:var(--acc);animation:sp 0.8s linear infinite}
  .page img.on + .spin{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  .hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px 18px;transition:opacity .25s,transform .25s;z-index:50}
  .hud.topbar{top:0;background:linear-gradient(#000c,#0000);padding-top:max(14px,env(safe-area-inset-top))}
  .hud.bottombar{bottom:0;background:linear-gradient(#0000,#000c);padding-bottom:max(20px,env(safe-area-inset-bottom))}
  #reader.chrome-off .hud.topbar{opacity:0;transform:translateY(-12px);pointer-events:none}
  #reader.chrome-off .hud.bottombar{opacity:0;transform:translateY(12px);pointer-events:none}
  .ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(30,28,34,.75);border:1px solid #ffffff1a;flex:none}
  .ib svg{width:22px;height:22px}
  .ib.on{background:var(--acc);color:#1a1300}
  .title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto;text-shadow:0 1px 3px #000}
  #pnum{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:74px;text-align:right;text-shadow:0 1px 3px #000}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:34px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,0%) 100% no-repeat,#ffffff30}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 6px #0008}
  #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:40;pointer-events:none}
  #loading div{background:#000a;padding:14px 22px;border-radius:999px;font-weight:600}

  /* ---------- Zoom ---------- */
  #zoom{position:absolute;inset:0;z-index:80;background:rgba(5,5,7,0);transition:background .25s;touch-action:none;overflow:hidden}
  #zoom.show{background:rgba(5,5,7,.92)}
  #zpage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 20px 60px #000}
  #zimg{display:block;width:100%;height:100%;-webkit-user-drag:none}
  #zcrisp{position:absolute;opacity:0;transition:opacity .2s;-webkit-user-drag:none;pointer-events:none}
  #zcrisp.on{opacity:1}
    #zclose{position:absolute;top:16px;right:16px;z-index:3}

  /* ---------- Balões ---------- */
  .page .bl{position:absolute;inset:0;pointer-events:none;z-index:2}
  .page .bl i{position:absolute;border-radius:16px;opacity:0}
  .page .bl.pulse i{animation:blp 1.5s ease-out}
  @keyframes blp{0%{opacity:0;box-shadow:0 0 0 0 rgba(255,204,51,.0);background:rgba(255,204,51,.0)}
    25%{opacity:1;box-shadow:0 0 0 3px rgba(255,204,51,.95),0 0 18px 4px rgba(255,204,51,.45);background:rgba(255,204,51,.10)}
    100%{opacity:0;box-shadow:0 0 0 6px rgba(255,204,51,0);background:rgba(255,204,51,0)}}
  body.bubbles-off .page .bl{display:none}
  #zoom.bubble.show{background:rgba(5,5,7,.78)}
  #zspot{position:absolute;left:0;top:0;width:0;height:0;border-radius:22px;pointer-events:none;opacity:0;z-index:1;
    box-shadow:0 0 0 200vmax rgba(5,5,7,.66),0 0 0 3px rgba(255,204,51,.9),0 0 30px 6px rgba(255,204,51,.25);transition:opacity .2s}
  #zspot.on{opacity:1}
  #zspot.anim{transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),opacity .2s}
  #zpage.anim{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
  #zpage.fade{opacity:0;transition:opacity .14s}
  #zbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;display:none;align-items:center;gap:6px;background:rgba(30,28,34,.85);border:1px solid #ffffff1a;border-radius:999px;padding:4px}
  #zoom.bubble #zbar{display:flex}
  #zbar .ib{width:44px;height:44px;background:transparent;border:0}
  #zcount{font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:center;font-size:15px}
  .chip{font-size:12px;font-weight:600;color:#ffe08a;background:rgba(42,36,16,.85);border:1px solid #5a4a12;border-radius:999px;padding:6px 12px;white-space:nowrap}

  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2b2833;border:1px solid var(--line);padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- BIBLIOTECA -->
<section id="library">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1300" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H11l-5 4v-4H4z"/></svg></div>
      <div><h1>Quadro</h1><small>leitor de HQ</small></div>
    </div>
    <button class="btn" id="btnFolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Escolher pasta</button>
    <button class="btn pri" id="btnAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Adicionar PDFs</button>
    <input type="file" id="fileIn" accept="application/pdf,.pdf" multiple hidden>
  </div>
  <div id="banner" class="banner hidden"></div>
  <div id="contWrap" class="hidden"><h2>Continuar lendo</h2><div id="cont" class="shelf row"></div></div>
  <div id="allWrap" class="hidden"><h2>Biblioteca</h2><div id="all" class="shelf"></div></div>
  <div id="empty" class="empty hidden">
    <b>Sua estante está vazia</b>
    Toque em <strong>Adicionar PDFs</strong> ou arraste os arquivos para cá.<br>
    <span id="emptyFolderHint">Instalado como app, dá para apontar direto para a pasta das suas HQs.</span>
  </div>
</section>

<!-- LEITOR -->
<section id="reader" class="hidden chrome-off">
  <div id="stage"><div id="book"></div></div>
  <div id="loading" class="hidden"><div>Abrindo…</div></div>
  <div class="hud topbar">
    <button class="ib" id="btnBack" title="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title" id="rTitle"></div>
    <span class="chip hidden" id="detChip"></span>
    <button class="ib" id="btnBubbles" title="Zoom em balão (IA)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H11l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/></svg></button>
    <button class="ib" id="btnSpread" title="Página dupla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg></button>
    <button class="ib" id="btnFull" title="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="hud bottombar">
    <button class="ib" id="btnGuide" title="Ler balão por balão"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
    <input type="range" id="scrub" min="0" max="0" value="0" step="1">
    <div id="pnum"></div>
  </div>
</section>

<!-- ZOOM -->
<div id="zoom" class="hidden">
  <div id="zpage"><img id="zimg" alt=""><img id="zcrisp" alt=""></div>
  <div id="zspot"></div>
  <div id="zbar">
    <button class="ib" id="zprev" title="Balão anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="zcount"></span>
    <button class="ib" id="znext" title="Próximo balão"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <button class="ib" id="zclose" title="Fechar zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
